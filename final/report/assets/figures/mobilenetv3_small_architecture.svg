   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18324e" x="28.068979" y="44.830279" transform="rotate(-0 28.068979 44.830279)">MobileNetV3-Small — Bộ phân loại thành viên EdgeFace</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58738b" x="28.068979" y="78.098828" transform="rotate(-0 28.068979 78.098828)">ImageNet pretrained → fine-tune sáu lớp • 1.524.006 tham số • ONNX FP32 / batch 1</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(239.479009 119.506895)">Input  |  Face crop RGB đã normalize</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(263.041509 132.50252)">Đầu ra: 1 × 3 × 224 × 224</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(203.839165 189.53691)">features.0  |  Stem Conv 3×3, s=2 + BN + h-swish</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(270.409478 202.532535)">Đầu ra: 16 × 112 × 112</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(227.489165 259.630206)">features.1  |  Bneck k=3, s=2, SE + ReLU</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(276.771978 272.625831)">Đầu ra: 16 × 56 × 56</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(225.87354 329.723501)">features.2–3  |  2 Bneck k=3, s=2/1, ReLU</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(276.771978 342.719126)">Đầu ra: 24 × 28 × 28</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(200.99854 399.816797)">features.4–6  |  3 Bneck k=5, s=2/1/1, SE + h-swish</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(276.771978 412.812422)">Đầu ra: 40 × 14 × 14</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(205.864165 469.910093)">features.7–8  |  2 Bneck k=5, s=1/1, SE + h-swish</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(276.771978 482.905718)">Đầu ra: 48 × 14 × 14</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(197.81729 540.003389)">features.9–11  |  3 Bneck k=5, s=2/1/1, SE + h-swish</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(283.134478 552.999014)">Đầu ra: 96 × 7 × 7</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(228.482134 610.096685)">features.12  |  Conv 1×1 + BN + h-swish</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(279.953228 623.09231)">Đầu ra: 576 × 7 × 7</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(222.81104 680.189981)">Pooling  |  Global average pooling → flatten</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(301.051665 693.185606)">Đầu ra: 576</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(152.040728 749.68609)">Classifier  |  Linear 576→1024 • h-swish • Dropout 0,2 • Linear 1024→6</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(292.24854 763.87609)">Đầu ra: 6 logits</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(820.579166 147.743385)">Inverted residual / Bneck</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(772.886431 163.046448)">1×1 expansion (khi cần) → depthwise k×k</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(791.582134 178.34951)">→ squeeze-and-excitation (nếu bật)</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(824.876041 192.33876)">→ 1×1 linear projection</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(771.730572 207.641823)">Skip nếu s=1 và số kênh đầu vào = đầu ra</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(796.430728 341.567269)">SE: điều chỉnh trọng số theo kênh</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(803.842837 357.387675)">DW: mỗi kênh một spatial filter</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(789.926978 372.690738)">PW 1×1: kết hợp thông tin các kênh</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(794.196353 386.679988)">BN: BatchNorm, k: kernel, s: stride</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(819.285806 515.072571)">Fine-tune trong EdgeFace</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(820.2844 529.834227)">Head stage: chỉ classifier</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(765.528462 543.823477)">Fine stage: features.10 / .11 / .12 + classifier</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(762.069478 559.12654)">BatchNorm running statistics được giữ cố định</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(810.435103 716.908886)">Hậu xử lý ngoài graph ONNX</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(814.57815 730.898136)">Softmax → max confidence</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(795.332447 746.201198)">Unknown nếu argmax = Unknown</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(802.909556 760.190448)">hoặc confidence &lt; 0,58332544</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(779.397056 774.795698)">Còn lại: dung / hung / son / thanh / tuan</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #18324e" transform="translate(804.834556 790.560761)">Dropout tắt ở chế độ inference</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58738b" x="28.068979" y="884.173104" transform="rotate(-0 28.068979 884.173104)">Hình mô tả kiến trúc PyTorch dùng để train; graph ONNX inference có thể gộp Conv/BN và loại Dropout. Không INT8/pruning.</text>
